<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPGDemo 源码复盘与游戏客户端面试 —— 从 2D 动作 RPG 到追问与场景题</title>
<style>{{KATEX_CSS}}</style>
<style>
:root{
  --bg:#FBFAF7; --paper:#FFFFFF; --ink:#1F2937; --ink2:#4B5563; --ink3:#6B7280; --line:#E5E7EB;
  --brand:#2F5BD3; --brand-soft:#EAF0FD; --accent:#C2410C; --accent-soft:#FFF4EC;
  --green:#15803D; --green-soft:#EAF7EF; --purple:#6D28D9; --purple-soft:#F3EEFE;
  --red:#B91C1C; --red-soft:#FDEEEE; --amber:#B45309; --amber-soft:#FEF6E4;
  --code-bg:#F7F8FA; --code-line:#E8EAEE;
  --side-w:300px;
  --font: "PingFang SC","Microsoft YaHei","Noto Sans SC","Hiragino Sans GB",system-ui,sans-serif;
  --mono: "JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.85;-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--accent));width:0;z-index:100}

/* ---------- sidebar ---------- */
#side{position:fixed;top:0;left:0;bottom:0;width:var(--side-w);background:#F4F2EC;border-right:1px solid var(--line);overflow-y:auto;padding:22px 14px 40px;z-index:50}
#side .brand{font-weight:800;font-size:17px;line-height:1.4;padding:0 8px 4px;color:var(--ink)}
#side .brand small{display:block;font-weight:500;font-size:12px;color:var(--ink3);margin-top:4px}
#side input{width:100%;margin:14px 0 10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-size:13px}
#toc{list-style:none;margin:0;padding:0;font-size:13.5px}
#toc .part{margin:16px 8px 4px;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
#toc a{display:block;padding:4px 8px;border-radius:6px;color:var(--ink2);line-height:1.5}
#toc a:hover{background:#ECE9E1;text-decoration:none}
#toc a.ch{font-weight:600;color:var(--ink)}
#toc a.sec{padding-left:22px;font-size:12.8px;display:none}
#toc li.open a.sec{display:block}
#toc a.active{background:var(--brand-soft);color:var(--brand)}
#menuBtn{display:none;position:fixed;top:12px;left:12px;z-index:60;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px}

/* ---------- main ---------- */
main{margin-left:var(--side-w);padding:0 48px 120px}
.wrap{max-width:900px;margin:0 auto}
.cover{min-height:92vh;display:flex;flex-direction:column;justify-content:center;padding:60px 0;border-bottom:1px solid var(--line)}
.cover .kicker{font-size:13px;letter-spacing:.2em;color:var(--accent);font-weight:700}
.cover h1{font-size:46px;line-height:1.25;margin:18px 0 12px;letter-spacing:-.01em}
.cover h1 em{font-style:normal;color:var(--brand)}
.cover .sub{font-size:18px;color:var(--ink2);max-width:680px}
.cover .meta{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;font-size:12.5px;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.pill.b{background:var(--brand-soft);border-color:#C9D7FA;color:var(--brand)}
.pill.o{background:var(--accent-soft);border-color:#F8D3BC;color:var(--accent)}
.pill.g{background:var(--green-soft);border-color:#BFE6CC;color:var(--green)}
.pill.p{background:var(--purple-soft);border-color:#DCCDFB;color:var(--purple)}

.part-head{margin:90px 0 10px;padding:34px 36px;border-radius:16px;background:linear-gradient(135deg,#1E3A8A 0%,#2F5BD3 60%,#4F7BEA 100%);color:#fff}
.part-head .no{font-size:13px;letter-spacing:.25em;opacity:.85;font-weight:700}
.part-head h1{margin:6px 0 6px;font-size:32px}
.part-head p{margin:0;opacity:.92}

section.chapter{padding-top:40px}
.ch-head{margin:40px 0 24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.ch-head .no{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.1em}
.ch-head h1{font-size:32px;line-height:1.35;margin:4px 0 6px}
.ch-head .lead{color:var(--ink2);font-size:15.5px;margin:0}
h2{font-size:23px;margin:46px 0 12px;padding-left:12px;border-left:4px solid var(--brand);line-height:1.45}
h3{font-size:18.5px;margin:30px 0 8px;color:#111827}
h4{font-size:16px;margin:22px 0 6px;color:var(--ink2)}
p{margin:10px 0}
strong{color:#111827}
ul,ol{padding-left:24px;margin:8px 0}
li{margin:3px 0}
code{font-family:var(--mono);font-size:.88em;background:#F1F2F5;border:1px solid #E6E8EC;padding:1px 5px;border-radius:5px;color:#9A3412;word-break:break-word}
hr{border:none;border-top:1px dashed var(--line);margin:30px 0}

/* goals box */
.goals{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 20px;margin:18px 0}
.goals .t{font-weight:700;font-size:14px;color:var(--ink3);letter-spacing:.06em}
.goals ul{margin:6px 0 0}

/* callouts */
.co{border-radius:10px;padding:12px 16px 12px 18px;margin:18px 0;border:1px solid;position:relative;font-size:15px}
.co .h{font-weight:700;display:block;margin-bottom:2px;font-size:14.5px}
.co p:first-of-type{margin-top:2px}
.co.tip{background:var(--green-soft);border-color:#BFE6CC}.co.tip .h{color:var(--green)}
.co.warn{background:var(--red-soft);border-color:#F5C7C7}.co.warn .h{color:var(--red)}
.co.deep{background:var(--purple-soft);border-color:#DCCDFB}.co.deep .h{color:var(--purple)}
.co.net{background:var(--brand-soft);border-color:#C9D7FA}.co.net .h{color:var(--brand)}
.co.ver{background:var(--amber-soft);border-color:#F3DDA8}.co.ver .h{color:var(--amber)}
.co.kit{background:#E6F6F5;border-color:#B5E3DF}.co.kit .h{color:#0F766E}
tr.hl td{background:#FEF3C7}
p.tcap{font-size:13.5px;color:var(--ink3);text-align:center;margin:-8px 0 16px}
p.tcap b{color:var(--ink2)}
.ans30{background:linear-gradient(135deg,#EEF4FF,#F8FAFF);border:1px solid #C9D7FA;border-radius:12px;padding:12px 18px;margin:18px 0}
.ans30 .h{font-weight:800;color:var(--brand);font-size:14.5px;display:block;margin-bottom:2px}
.co.ana{background:#fff;border-color:var(--line);border-left:4px solid var(--accent)}.co.ana .h{color:var(--accent)}

/* figures */
figure{margin:26px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 10px}
figure>svg{width:100%;height:auto;display:block}
figure>svg text{font-family:var(--font);fill:#1F2937;font-size:13px}
figure>svg .sm{font-size:11.5px;fill:#4B5563}
figure>svg .xs{font-size:10.5px;fill:#6B7280}
figure>svg .b{font-weight:700}
figure>svg .mono{font-family:var(--mono);font-size:11.5px}
figure>svg .wt{fill:#FFFFFF}
figure>svg text{paint-order:stroke fill;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
figure>svg .wt{stroke:none}
@media print{figure>svg text{stroke:none}}
figure>svg g.sm text{font-size:11.5px}
figure>svg g.xs text{font-size:10.5px}
figure>svg g.mono text{font-family:var(--mono);font-size:11px}
figcaption{font-size:13.5px;color:var(--ink3);text-align:center;margin-top:8px}
figcaption b{color:var(--ink2)}

/* tables */
.tbl{overflow-x:auto;margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:14.5px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#F3F4F6;font-weight:700;color:#111827;white-space:nowrap}
tr:last-child td{border-bottom:none}
td code{font-size:.84em}
.yes{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}.mid{color:var(--amber);font-weight:700}

/* code */
.code{margin:16px 0;border:1px solid var(--code-line);border-radius:10px;background:var(--code-bg);overflow:hidden}
.code .bar{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;background:#EEF0F4;border-bottom:1px solid var(--code-line);font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.code .bar button{border:1px solid #D9DCE2;background:#fff;border-radius:6px;font-size:11.5px;padding:1px 8px;cursor:pointer;color:var(--ink2)}
.code pre{margin:0;padding:12px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.2px;line-height:1.62;color:#24292F;tab-size:4}
.k{color:#CF222E}.ty{color:#8250DF}.s{color:#0A3069}.c{color:#6E7781;font-style:italic}.n{color:#0550AE}.m{color:#953800}.f{color:#6639BA}

/* steps & cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.card .t{font-weight:700;margin-bottom:2px}
.card p{margin:4px 0;font-size:14.5px;color:var(--ink2)}
.recap{background:#111827;color:#E5E7EB;border-radius:14px;padding:18px 24px;margin:34px 0 10px}
.recap .t{font-weight:800;color:#FCD34D;letter-spacing:.05em;font-size:14px}
.recap ul{margin:6px 0 0}
.recap code{background:#1F2937;border-color:#374151;color:#FCA5A5}
.recap strong{color:#fff}
details.quiz{background:#fff;border:1px dashed #CBD5E1;border-radius:12px;padding:10px 16px;margin:12px 0}
details.quiz summary{cursor:pointer;font-weight:700;color:var(--ink2)}
details.quiz[open] summary{margin-bottom:6px}

/* 事实等级标签 */
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 7px;border-radius:5px;margin-right:4px;vertical-align:1px;line-height:1.7}
.tag.src{background:#EAF0FD;color:#2F5BD3;border:1px solid #C9D7FA}
.tag.bug{background:#FDEEEE;color:#B91C1C;border:1px solid #F5C7C7}
.tag.fix{background:#E6F6F5;color:#0F766E;border:1px solid #B5E3DF}
.tag.ext{background:#F3EEFE;color:#6D28D9;border:1px solid #DCCDFB}
.tag.ex{background:#EAF7EF;color:#15803D;border:1px solid #BFE6CC}
.tag.inf{background:#F3F4F6;color:#4B5563;border:1px solid #D1D5DB}
.tag.mdl{background:#FEF6E4;color:#B45309;border:1px solid #F3DDA8}
.tag.int{background:#FFF4EC;color:#C2410C;border:1px solid #F8D3BC}
.tag.pub{background:#F3F4F6;color:#374151;border:1px solid #9CA3AF}
.tag.now{background:#C2410C;color:#fff;border:1px solid #C2410C}
.tag.ideal{background:#15803D;color:#fff;border:1px solid #15803D}
.code.now{border-left:5px solid #C2410C}.code.now .bar{background:#FFF4EC}
.code.ideal{border-left:5px solid #15803D}.code.ideal .bar{background:#EAF7EF}
.cb{display:inline-block;font-family:var(--font);font-size:11px;font-weight:800;padding:0 7px;border-radius:5px;margin-right:8px;color:#fff;line-height:1.7}
.cb.now{background:#C2410C}.cb.ideal{background:#15803D}
.fs{display:inline-block;font-size:11px;font-weight:800;padding:0 6px;border-radius:5px;margin-right:6px;color:#fff;line-height:1.7;vertical-align:1px}
.fs.now{background:#C2410C}.fs.ideal{background:#15803D}.fs.vs{background:linear-gradient(90deg,#C2410C 0 50%,#15803D 50% 100%)}
.cmp{margin:20px 0;border:1px solid #D1D5DB;border-radius:12px;overflow:hidden;background:#fff}
.cmp .cmp-h{padding:8px 16px;font-weight:800;font-size:14.5px;background:#F9FAFB;border-bottom:1px solid var(--line)}
.cmp .tbl{margin:0}.cmp table{border:none;border-radius:0;font-size:14px}
.cmp th.now{background:#FFF4EC;color:#C2410C}.cmp th.ideal{background:#EAF7EF;color:#15803D}
.cmp td.now{background:#FFFBF7}.cmp td.ideal{background:#F6FCF8}
.cmp td.dim{font-weight:700;white-space:nowrap;color:#111827}
.cmp .cmp-f{padding:6px 16px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--line);background:#FCFCFD}
.vb{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;margin-top:4px;line-height:1.7}
.vb.g{background:#DCFCE7;color:#15803D}.vb.s{background:#F3F4F6;color:#6B7280}.vb.b{background:#DBEAFE;color:#1D4ED8}.vb.p{background:#EDE9FE;color:#6D28D9}
@media print{.cmp{break-inside:auto}.cmp tr{break-inside:avoid}}
.sev.hz{background:#FFF7ED;color:#C2410C;border:1px dashed #FB923C}.sev.lim{background:#EEF2FF;color:#4338CA;border:1px solid #C7D2FE}.sev.ok{background:#DCFCE7;color:#15803D;border:1px solid #BBF7D0}
.cmp table{table-layout:fixed;width:100%;font-size:13.4px}.cmp td.dim{white-space:normal}
.cmp col.c-dim{width:10%}.cmp col.c-now{width:21%}.cmp col.c-prob{width:25%}.cmp col.c-ideal{width:25%}.cmp col.c-why{width:19%}
.cmp th.prob{background:#FDEEEE;color:#B91C1C}.cmp td.prob{background:#FFF8F8;color:#3F1D1D}
.cmp td .sev{margin-right:3px;font-size:11px;padding:0 5px}.cmp .cmp-f .sev{font-size:11px;padding:0 5px;margin-right:2px}
.cprob{padding:7px 14px;border-top:1px dashed #F5C7C7;background:#FFF8F8;font-size:13px;color:#3F1D1D;line-height:1.65;font-family:var(--font)}
.cpl{display:inline-block;font-weight:800;color:#B91C1C;margin-right:7px;font-size:12px;font-family:var(--font)}
.fprob{display:block;margin:6px auto 0;max-width:94%;text-align:left;font-size:12.8px;color:#3F1D1D;background:#FFF8F8;border:1px solid #F8D4D4;border-radius:8px;padding:4px 10px;line-height:1.6}
.fprob .sev{font-size:11px;padding:0 5px}
.nw{white-space:nowrap;margin-right:3px}
.pit{background:#FFFBF5;border:1px solid #F8D3BC;border-left:4px solid var(--accent);border-radius:10px;margin:16px 0;padding:8px 18px 10px}
.pit .q{font-weight:800;color:var(--accent);font-size:15.5px;margin:4px 0 2px}
.pit p{margin:6px 0}
.sev{display:inline-block;font-size:11.5px;font-weight:800;padding:0 7px;border-radius:5px;line-height:1.7;font-family:var(--mono)}
.sev.p0{background:#B91C1C;color:#fff}.sev.p1{background:#FDEEEE;color:#B91C1C;border:1px solid #F5C7C7}
.sev.p2{background:#FEF6E4;color:#B45309;border:1px solid #F3DDA8}.sev.p3{background:#F3F4F6;color:#4B5563;border:1px solid #D1D5DB}
.ans{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 20px 12px;margin:16px 0}
.ans .q{font-weight:800;font-size:17px;margin:12px 0 4px;color:var(--brand)}
.ans p{margin:8px 0}
.scene{background:#FFFDF8;border:1px solid #EADFC8;border-left:4px solid var(--amber);border-radius:10px;margin:18px 0;padding:10px 18px 10px}
.scene .q{font-weight:800;color:var(--amber);font-size:16px;margin:4px 0 2px}
.scene .why{font-size:13.5px;color:var(--ink3);margin:0 0 6px}
.scene p{margin:6px 0}
.lab canvas,.lab svg.labsvg{width:100%;height:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:10px;margin-top:8px}
.lab select{font:inherit;font-size:13.5px;padding:2px 6px;border:1px solid var(--line);border-radius:6px}
/* interactive */
.lab{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin:22px 0}
.lab .t{font-weight:800;color:var(--accent);font-size:14px;letter-spacing:.06em}
.lab label{font-size:13.5px;color:var(--ink2)}
.lab input[type=number]{width:80px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13.5px}
.lab input[type=range]{width:220px;vertical-align:middle}
.lab .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}
.lab .out{font-family:var(--mono);font-size:13.5px;background:var(--code-bg);border:1px solid var(--code-line);border-radius:8px;padding:10px 12px;white-space:pre-wrap}

.term{margin:16px 0;border-radius:10px;background:#0F172A;color:#E2E8F0;overflow:hidden;border:1px solid #1E293B}
.term .bar{padding:5px 12px;background:#1E293B;font-size:12.5px;color:#94A3B8;font-family:var(--mono)}
.term pre{margin:0;padding:12px 16px;font-family:var(--mono);font-size:12.6px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.term .hl{color:#FCD34D;font-weight:700}.term .ok{color:#86EFAC}.term .bad{color:#FCA5A5}
.ans{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 20px 12px;margin:16px 0}
.ans .q{font-weight:800;font-size:17px;margin:12px 0 4px;color:var(--brand)}
.st-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;margin:3px;font:inherit;font-size:13px;cursor:pointer}
.st-btn:hover{background:var(--brand-soft)}
.st-btn:disabled{opacity:.35;cursor:not-allowed}
@media print{.term{background:#F8FAFC;color:#111;border-color:#CBD5E1}.term .bar{background:#E2E8F0;color:#334155}.term .hl{color:#B45309}.term .ok{color:#15803D}.term .bad{color:#B91C1C}}
/* ---------- math ---------- */
.katex{font-size:1.07em}
.katex-display{margin:.7em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.mathbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 16px;margin:14px 0}
/* 逐行推导 */
.deriv{background:#FFFDF8;border:1px solid #EADFC8;border-left:4px solid var(--amber);border-radius:10px;margin:18px 0;padding:10px 14px 8px}
.deriv .dh{font-weight:800;color:var(--amber);font-size:14.5px;margin-bottom:4px;letter-spacing:.02em}
.deriv .dt{overflow-x:auto}
.deriv table{border:none;background:transparent;width:auto;min-width:100%;font-size:15px}
.deriv td{border:none;padding:5px 6px;vertical-align:middle}
.deriv td.dn{color:var(--amber);font-weight:700;width:22px;font-size:14px}
.deriv td.dl{text-align:right;white-space:nowrap;padding-right:0}
.deriv td.dr{text-align:left;white-space:nowrap;padding-left:2px}
.deriv td.dw{color:var(--ink3);font-size:13.2px;padding-left:18px;min-width:170px;line-height:1.55}
.deriv tr.dc td{color:var(--ink2);font-size:14px;padding-top:8px}
.deriv tr.dk td.dr,.deriv tr.dk td.dl{background:#FEF3C7}
.deriv tr.dk td.dl{border-radius:6px 0 0 6px}.deriv tr.dk td.dr{border-radius:0 6px 6px 0}
/* 大纲卡片 */
.oc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 20px 12px;margin:18px 0}
.oc .oh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.oc .ono{font-family:var(--mono);font-weight:800;color:var(--accent);font-size:14px}
.oc .ot{font-weight:800;font-size:18px;color:#111827}
.oc .pri{margin-left:auto;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:999px}
.oc .pri.p4{background:#FDEEEE;color:var(--red);border:1px solid #F5C7C7}
.oc .pri.p3{background:var(--accent-soft);color:var(--accent);border:1px solid #F8D3BC}
.oc .pri.p2{background:var(--brand-soft);color:var(--brand);border:1px solid #C9D7FA}
.oc .oq{color:var(--ink2);font-size:14.5px;margin:8px 0 4px}
.oc .og{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px}
.oc .og>div{font-size:14px;line-height:1.7}
.oc .og .ol{font-weight:800;font-size:12.5px;color:var(--ink3);letter-spacing:.08em;margin-top:6px}
.oc .og ul,.oc .og ol{margin:2px 0;padding-left:20px}
.oc .og li{margin:1px 0}
.oc .ometa{font-size:12.8px;color:var(--ink3);margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.oc .wide{grid-column:1 / -1}
@media (max-width:720px){.oc .og{grid-template-columns:1fr}}
.foot{margin-top:80px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink3);font-size:13px;text-align:center}

@media (max-width:1000px){
  #side{transform:translateX(-100%);transition:.25s}
  #side.show{transform:none;box-shadow:0 0 40px rgba(0,0,0,.15)}
  #menuBtn{display:block}

<script>
/* ---------- C++ / ini 轻量高亮 ---------- */
(function(){
  const KW = new Set(("readonly ref out var foreach in is as null string object base get set lock event delegate params internal sealed abstract partial where yield checked unchecked alignas auto bool break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend if inline int int32 int16 uint8 uint16 uint32 int64 namespace new nullptr operator override private protected public return short signed sizeof static static_cast struct switch template this throw true try typedef typename union unsigned using virtual void volatile while final pid_t size_t ssize_t DWORD HANDLE LPVOID BOOL WINAPI CALLBACK VOID ULONG_PTR std uint64_t uint32_t uint16_t uint8_t int32_t int16_t SOCKET").split(" "));
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])')|(\b\d+(?:\.\d+)?f?\b)|(#\s*\w+)|(\b[A-Za-z_]\w*\b)/g;
  function hl(src, lang){
    if(lang==="ini"){
      return src.split("\n").map(l=>{
        if(/^\s*;/.test(l)) return '<span class="c">'+esc(l)+'</span>';
        if(/^\s*\[/.test(l)) return '<span class="ty">'+esc(l)+'</span>';
        const m=l.match(/^([^=]+)=(.*)$/); if(m) return '<span class="n">'+esc(m[1])+'</span>=<span class="s">'+esc(m[2])+'</span>';
        return esc(l);}).join("\n");
    }
    if(lang==="py"){
      const PK=new Set("def return if elif else for while in not and or is None True False import from as class lambda with yield pass break continue try except finally raise global nonlocal assert del self np torch".split(" "));
      const pre=/(#[^\n]*)|("""[\s\S]*?"""|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*")|(\b\d+(?:\.\d+)?(?:e-?\d+)?\b)|(\b[A-Za-z_]\w*\b)/g;
      let o="",l=0,mm; pre.lastIndex=0;
      while((mm=pre.exec(src))){ o+=esc(src.slice(l,mm.index)); l=pre.lastIndex; const t=mm[0];
        if(mm[1]) o+='<span class="c">'+esc(t)+'</span>'; else if(mm[2]) o+='<span class="s">'+esc(t)+'</span>';
        else if(mm[3]) o+='<span class="n">'+t+'</span>';
        else { const nx=src.slice(pre.lastIndex).match(/^\s*\(/);
          if(PK.has(t)) o+='<span class="k">'+t+'</span>'; else if(nx) o+='<span class="f">'+t+'</span>'; else o+=t; } }
      return o+esc(src.slice(l));
    }
    if(lang==="text") return esc(src);
    if(lang==="bash") return src.split("\n").map(l=>/^\s*#/.test(l)?'<span class="c">'+esc(l)+'</span>':(/^\$ /.test(l)?'<span class="k">$</span> '+esc(l.slice(2)):esc(l))).join("\n");
    let out="",last=0,m;
    re.lastIndex=0;
    while((m=re.exec(src))){
      out+=esc(src.slice(last,m.index)); last=re.lastIndex;
      const t=m[0];
      if(m[1]) out+='<span class="c">'+esc(t)+'</span>';
      else if(m[2]) out+='<span class="s">'+esc(t)+'</span>';
      else if(m[3]) out+='<span class="n">'+t+'</span>';
      else if(m[4]) out+='<span class="m">'+esc(t)+'</span>';
      else {
        const nx=src.slice(re.lastIndex).match(/^\s*\(/);
        if(KW.has(t)) out+='<span class="k">'+t+'</span>';
        else if(/^[A-Z][A-Z0-9_]{2,}$/.test(t)) out+='<span class="m">'+t+'</span>';
        else if(/^[FUAETI][A-Z][A-Za-z0-9_]+$/.test(t)||/^(TimerData|TimerHandle|TimerSystem|EventSystem|RingBuffer|World|MonoSingleton|Action|Delegate|Dictionary|List|Queue|Stack|Type|GameObject|MonoBehaviour|CombatPawn|IFactionMember|SoulPlayerController|SimpleAIController|SurvivalGameMode|SurvivalGameState|Vector3|Vector2|Mathf|Time|Exception|Debug|Rigidbody2D|Collider2D|CapsuleCollider2D|CircleCollider2D|Physics2D|RaycastHit2D|Animator|Transform|SpriteRenderer|Material|Color|ScriptableObject|IEnumerator|WaitForSeconds|Coroutine|Input|KeyCode|Random|LayerMask|Quaternion|Camera|Slider|RectTransform|Image|TextMeshProUGUI|PointerEventData|ContactFilter2D|Entity|EntityFX|Player|Enemy|Enemy_Skeleton|PlayerState|EnemyState|PlayerStateMachine|EnemyStateMachine|CharacterStats|PlayerStats|EnemyStats|Stat|Skill|SkillManager|PlayerManager|Skill_Dash|Skill_Clone|Skill_ThrowSword|SkillController_Clone|SkillController_ThrowSword|Controller_ThunderStrike|Inventory|InventoryItem|ItemData|ItemData_Equipment|ItemDrop|ItemObject|UI_ItemSlot|UI_EquipmentSlot|UI_CraftSlot|UI_HealthBar|SwordType|ItemType|EquipmentType|DamageInfo|HitResult|IDamageable|ObjectPool|Modifier|StatModifier|Buff|InputBuffer|PlayerInput|IState|StateMachine|Transition)$/.test(t)) out+='<span class="ty">'+t+'</span>';
        else if(/^(vector|string|deque|map|set|sockaddr_in|ikcpcb|IKCPSEG|Segment|Packet|Header|Sender|Receiver|optional|array|bitset|span|function|pair|less|greater|priority_queue|Node|OpenE|Cmp|Map|Grid|GridPathfinder|Vec2|T)$/.test(t)) out+='<span class="ty">'+t+'</span>';
        else if(nx) out+='<span class="f">'+t+'</span>';
        else out+=t;
      }
    }
    out+=esc(src.slice(last));
    return out;
  }
  document.querySelectorAll(".code pre").forEach(pre=>{
    pre.innerHTML=hl(pre.textContent, pre.dataset.lang||"cpp");
  });
  document.querySelectorAll(".code .bar button").forEach(b=>{
    b.onclick=()=>{const t=b.closest(".code").querySelector("pre").innerText;navigator.clipboard&&navigator.clipboard.writeText(t);b.textContent="已复制";setTimeout(()=>b.textContent="复制",1200);};
  });
})();

/* ---------- 目录生成 / 滚动定位 ---------- */
(function(){
  const toc=document.getElementById("toc");
  const nodes=document.querySelectorAll(".part-head, section.chapter");
  const links=[];
  let secCounter=0;
  nodes.forEach(n=>{
    if(n.classList.contains("part-head")){
      const li=document.createElement("li"); li.className="part"; li.textContent=n.dataset.toc||n.querySelector("h1").textContent; toc.appendChild(li); return;
    }
    const li=document.createElement("li");
    const h=n.querySelector(".ch-head h1");
    const no=n.querySelector(".ch-head .no");
    const a=document.createElement("a"); a.className="ch"; a.href="#"+n.id;
    a.textContent=(no?no.textContent.replace(/^\s*(CHAPTER|BASICS\s*·|APPENDIX\s*·|OUTLINE\s*·?)\s*/i,"").trim()+" · ":"")+h.textContent;
    li.appendChild(a); links.push([n,a,li]);
    n.querySelectorAll("h2").forEach(h2=>{
      if(!h2.id) h2.id="s"+(++secCounter);
      const s=document.createElement("a"); s.className="sec"; s.href="#"+h2.id; s.textContent=h2.textContent;
      li.appendChild(s); links.push([h2,s,li]);
    });
    toc.appendChild(li);
  });
  const bar=document.getElementById("progress");
  function onScroll(){
    const st=window.scrollY, h=document.documentElement.scrollHeight-innerHeight;
    bar.style.width=(st/h*100)+"%";
    let cur=null;
    for(const [el,a,li] of links){ if(el.getBoundingClientRect().top<120) cur=[el,a,li]; }
    document.querySelectorAll("#toc a.active").forEach(x=>x.classList.remove("active"));
    document.querySelectorAll("#toc li.open").forEach(x=>x.classList.remove("open"));
    if(cur){cur[1].classList.add("active");cur[2].classList.add("open");
      const chA=cur[2].querySelector("a.ch"); if(chA!==cur[1]) chA.classList.add("active");}
  }
  addEventListener("scroll",onScroll,{passive:true}); onScroll();
  document.getElementById("q").addEventListener("input",e=>{
    const q=e.target.value.trim().toLowerCase();
    toc.querySelectorAll("li").forEach(li=>{
      if(li.classList.contains("part")) {li.style.display=q?"none":"";return;}
      const hit=!q||li.textContent.toLowerCase().includes(q);
      li.style.display=hit?"":"none";
      if(q&&hit) li.classList.add("open");
    });
  });
  toc.addEventListener("click",e=>{if(e.target.tagName==="A") document.getElementById("side").classList.remove("show");});
})();
